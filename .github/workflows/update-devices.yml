name: 自動更新支援設備清單

on:
  schedule:
    # 每週一 UTC 03:00 (台灣時間 11:00) 自動檢查官方更新
    - cron: '0 3 * * 1'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊一鍵更新

permissions:
  contents: write

jobs:
  update-devices:
    name: 同步官方最新支援設備
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行設備同步更新腳本
        run: |
          chmod +x shell/sync-devices.py
          python3 shell/sync-devices.py

      - name: 檢測並自動提交推送變更
        id: git_check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet data/devices.json .github/workflows/build-firmware.yml; then
            echo "設備清單已是最新，無需更新。"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "偵測到設備列表有更新，正在提交變更..."
            git add data/devices.json .github/workflows/build-firmware.yml
            git commit -m "chore(devices): 自動同步官方最新支援設備清單 [skip ci]"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: 輸出更新摘要
        run: |
          COUNT=$(jq 'keys | length' data/devices.json)
          echo "### 📱 設備庫同步報告" >> $GITHUB_STEP_SUMMARY
          echo "- **當前支援設備總數**: $COUNT 款" >> $GITHUB_STEP_SUMMARY
          echo "- **資料源**: OpenWrt / ImmortalWrt 官方 Releases" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.git_check.outputs.updated }}" = "true" ]; then
            echo "- **更新結果**: ✅ 已自動同步最新設備並更新 Action 選單" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **更新結果**: ℹ️ 目前已是最新狀態" >> $GITHUB_STEP_SUMMARY
          fi
