name: 構建 OpenWrt / ImmortalWrt 自訂韌體

on:
  workflow_dispatch:
    inputs:
      firmware_type:
        description: '選擇韌體系統分支'
        required: true
        type: choice
        default: 'ImmortalWrt'
        options:
          - 'ImmortalWrt'
          - 'OpenWrt'

      luci_version:
        description: '韌體版本 (輸入 auto 或 latest 自動抓取最新正式版)'
        required: true
        default: 'auto'
        type: string

      rootfs_size_g:
        description: '軟體包分區空間大小 (單位：GB，請直接輸入數字，例如 1 或 2)'
        required: true
        default: '1'
        type: string

